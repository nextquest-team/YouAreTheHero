services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: hero
      POSTGRES_DB: hero
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hero']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://hero:hero@db:5432/hero
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please}
    ports:
      - '3000:3000'
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
