name: api

on:
  pull_request:
  push:
    branches:
      - develop
      - main

# Pas de filtre paths : le check "api" est requis par les rulesets,
# il doit toujours se déclencher, même avant que api/ existe.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hero
          POSTGRES_PASSWORD: hero
          POSTGRES_DB: hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero -d hero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hero:hero@localhost:5432/hero_test
      JWT_SECRET: test-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Détecter la présence de l'API
        id: detect
        working-directory: .
        run: |
          if [ -f api/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: API pas encore présente
        if: steps.detect.outputs.exists == 'false'
        working-directory: .
        run: echo "::notice::api/ n'existe pas encore, ce job reste vert en attendant la PR qui l'introduit."

      - name: Setup Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.detect.outputs.exists == 'true'
        run: npm run typecheck

      - name: Migrations de la base de données
        if: steps.detect.outputs.exists == 'true'
        run: npm run db:migrate

      - name: Tests
        if: steps.detect.outputs.exists == 'true'
        run: npm test

      - name: Setup Buildx
        if: steps.detect.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image Docker
        if: steps.detect.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
